[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-negotiation-research"
version = "0.1.0"
description = "Traceable synthetic negotiation research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
